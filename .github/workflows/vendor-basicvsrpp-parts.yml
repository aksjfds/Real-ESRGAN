name: Vendor BasicVSR++ split weights

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/vendor-basicvsrpp-parts.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and split official Track 1 checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import math
          import urllib.request
          from pathlib import Path

          url = (
              "https://download.openmmlab.com/mmediting/restorers/basicvsr_plusplus/"
              "basicvsr_plusplus_c128n25_ntire_decompress_track1_20210223-7b2eba02.pth"
          )
          name = "basicvsr_plusplus_c128n25_ntire_decompress_track1_20210223-7b2eba02.pth"
          weights = Path("inference/weights")
          weights.mkdir(parents=True, exist_ok=True)
          full = Path("/tmp") / name
          urllib.request.urlretrieve(url, full)

          digest = hashlib.sha256(full.read_bytes()).hexdigest()
          if not digest.startswith("7b2eba02"):
              raise SystemExit(f"unexpected checkpoint sha256: {digest}")

          size = full.stat().st_size
          mib = 1024 * 1024
          # Prefer exactly two near-equal parts when both remain <=95 MiB.
          count = 2 if size <= 190 * mib else math.ceil(size / (90 * mib))
          chunk = math.ceil(size / count)
          if chunk >= 100 * mib:
              raise SystemExit(f"chunk too large for regular GitHub Git object: {chunk / mib:.2f} MiB")

          for old in weights.glob(f"{name}.part[0-9][0-9]"):
              old.unlink()

          with full.open("rb") as source:
              for index in range(1, count + 1):
                  target = weights / f"{name}.part{index:02d}"
                  remaining = min(chunk, size - source.tell())
                  with target.open("wb") as output:
                      while remaining > 0:
                          block = source.read(min(8 * mib, remaining))
                          if not block:
                              raise SystemExit("unexpected EOF while splitting checkpoint")
                          output.write(block)
                          remaining -= len(block)

          parts = sorted(weights.glob(f"{name}.part[0-9][0-9]"))
          if sum(part.stat().st_size for part in parts) != size:
              raise SystemExit("split checkpoint size mismatch")
          print(f"checkpoint={size / mib:.2f} MiB sha256={digest}")
          print(f"parts={len(parts)} sizes={[round(p.stat().st_size / mib, 2) for p in parts]}")
          PY

      - name: Commit split checkpoint parts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inference/weights/basicvsr_plusplus_c128n25_ntire_decompress_track1_20210223-7b2eba02.pth.part??
          git commit -m "Bundle BasicVSR++ split weights"
          git push origin HEAD:master
