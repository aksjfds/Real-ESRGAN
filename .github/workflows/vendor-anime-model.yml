name: Vendor AnimeVideo-v3 model

on:
  push:
    paths:
      - .github/workflows/vendor-anime-model.yml

permissions:
  contents: write

jobs:
  vendor-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official AnimeVideo-v3 weight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inference/weights
          curl -L --fail --retry 3 \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth \
            -o inference/weights/realesr-animevideov3.pth
          echo 'b8a8376811077954d82ca3fcf476f1ac3da3e8a68a4f4d71363008000a18b75d  inference/weights/realesr-animevideov3.pth' | sha256sum -c -

      - name: Commit model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inference/weights/realesr-animevideov3.pth
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add AnimeVideo-v3 model'
          git push origin HEAD:master
