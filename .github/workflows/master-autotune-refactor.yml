name: Apply master auto tuning refactor

on:
  push:
    paths:
      - tools/apply_master_refactor.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate refactor
        run: |
          set -euo pipefail
          python tools/apply_master_refactor.py
          python -m py_compile inference.py inference/*.py encode/*.py inference/models/*.py
      - name: Commit refactor
        run: |
          set -euo pipefail
          rm .github/workflows/master-autotune-refactor.yml tools/apply_master_refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add auto tuning and clean inference output'
          git push origin HEAD:master
